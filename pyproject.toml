[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybb3"
version = "0.1.0"
description = "Unofficial headless Python client for the Blood Bowl 3 backend protocol"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dennis Granåsen"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bb3 = "bb3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "live: accesses the live Steam/BB3 services and requires PYBB3_RUN_LIVE_TESTS=1",
    "destructive: mutates live BB3 account state and additionally requires PYBB3_ALLOW_DESTRUCTIVE_TESTS=1",
]
