[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bb3-client"
version = "0.1.0"
description = "Unofficial headless Python client for the Blood Bowl 3 backend protocol"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dennis Granåsen"}]
dependencies = []

[project.scripts]
bb3 = "bb3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
